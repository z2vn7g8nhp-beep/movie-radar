<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="电影雷达">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>电影雷达</title>
<style>
:root{
  --bg:#f6f6f9;
  --card:#ffffff;
  --soft:#eef0f4;          /* 输入框、次级按钮 */
  --hair:rgba(24,26,48,.08);
  --ink:#1c1d24;
  --ink-2:#4b4d58;
  --dim:#7c7f8c;
  --faint:#a9acb7;
  --coral:#ff6a3d;         /* 票 / 强调 */
  --coral-ink:#d9481c;
  --coral-bg:#fff1ea;
  --coral-line:#ffd5c5;
  --gold:#ffb020;
  --up:#1fa463; --warn:#e5484d;
  --db:#00b51d; --im:#f5c518; --tm:#fa320a;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  --latin:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --shadow:0 1px 2px rgba(24,26,48,.05),0 8px 24px rgba(24,26,48,.08);
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --pad:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{padding-bottom:calc(88px + var(--sb))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
img{display:block}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:10px}
.hscroll{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;padding:2px var(--pad) 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
/* 按下时轻轻缩一下 */
.card,.row,.otk,.ev,.hero-in,.links a,.icon-btn,.tabs button{transition:transform .18s cubic-bezier(.3,.7,.4,1),background-color .2s,opacity .2s}
.card:active,.row:active,.otk:active,.ev:active,.hero-in:active,.links a:active{transform:scale(.97)}
.icon-btn:active{transform:scale(.9)}

/* ---------- 顶栏 ---------- */
.bar{position:sticky;top:0;z-index:5;padding:calc(var(--st) + 12px) var(--pad) 10px;
  background:rgba(246,246,249,.8);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);
  border-bottom:.5px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--hair)}
.bar-row{display:flex;align-items:center;gap:8px}
.bar h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.bar .sub{color:var(--faint);font-size:12px;margin-top:1px}
.bar h1,.bar .sub{transition:font-size .25s,opacity .2s,height .2s}
.bar.scrolled h1{font-size:17px}
.bar.scrolled .sub{opacity:0;height:0;margin:0}
.icon-btn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--card);color:var(--ink-2);box-shadow:0 1px 3px rgba(24,26,48,.08)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-pressed=true]{background:var(--ink);color:#fff}
.bar.scrolled .icon-btn{width:32px;height:32px}
.searchbox{display:none;margin-top:10px}
.searchbox.on{display:block}
.searchbox input{width:100%;background:var(--card);border:.5px solid var(--hair);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:16px;box-shadow:0 1px 3px rgba(24,26,48,.04)}
.searchbox input::placeholder{color:var(--faint)}
.searchbox input:focus{outline:none;border-color:var(--coral-line)}

/* ---------- 底部标签 ---------- */
.tabs{position:fixed;left:14px;right:14px;bottom:calc(10px + var(--sb));z-index:6;display:flex;padding:5px;border-radius:26px;
  background:rgba(255,255,255,.93);-webkit-backdrop-filter:saturate(1.8) blur(24px);backdrop-filter:saturate(1.8) blur(24px);
  box-shadow:0 10px 30px rgba(24,26,48,.12),inset 0 0 0 .5px rgba(24,26,48,.06)}
.tabfade{position:fixed;left:0;right:0;bottom:0;height:calc(110px + var(--sb));z-index:5;pointer-events:none;
  background:linear-gradient(rgba(246,246,249,0),rgba(246,246,249,.85) 45%,rgba(246,246,249,.98))}
.tab-ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:21px;background:var(--coral-bg);z-index:0;
  transition:transform .5s cubic-bezier(.3,1.25,.45,1),width .35s cubic-bezier(.3,1.25,.45,1)}
.tabs button{z-index:1}
.tabs button[aria-selected=true] svg{animation:tabpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabpop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:none}}
.tabs button{flex:1;height:48px;border-radius:21px;font-size:10.5px;font-weight:500;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tabs svg{width:22px;height:22px}
.tabs button[aria-selected=true]{color:var(--coral)}
.tabs .n{position:absolute;top:5px;left:calc(50% + 7px);min-width:15px;height:15px;border-radius:8px;background:var(--coral);color:#fff;font-size:10px;line-height:15px;text-align:center;padding:0 4px;font-weight:600}

/* ---------- 票根 ---------- */
.tk{--n:3.5px;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:5px;
  background:var(--coral-bg);color:var(--coral-ink);font-size:11px;font-weight:500;white-space:nowrap;box-shadow:inset 0 0 0 .5px var(--coral-line);
  -webkit-mask:radial-gradient(circle var(--n) at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--n) at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle var(--n) at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--n) at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.tk b{font-family:var(--num);font-size:12px;font-weight:600;letter-spacing:.01em}
.tk.ghost{background:var(--soft);color:var(--faint);box-shadow:none}
.tk.big{--n:4.5px;height:30px;padding:0 12px;font-size:12px;border-radius:7px}
.tk.big b{font-size:13px}
.pw .tk{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tk.new{animation:pulse 2.4s ease-in-out 2}
@keyframes pulse{50%{box-shadow:inset 0 0 0 .5px var(--coral-line),0 0 0 4px rgba(255,106,61,.15)}}

/* ---------- 评分 ---------- */
.rates{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.r{display:inline-flex;align-items:center;gap:4px;font-family:var(--num);font-weight:500;font-size:13px;line-height:1;color:var(--ink)}
.r svg{width:14px;height:14px;flex:none}
.r.im svg{width:24px}

/* ---------- 顶部：星标的待映，左右翻页 ---------- */
.heroes{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 12px;scroll-padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain}
.heroes::-webkit-scrollbar{display:none}
.heroes .hero{flex:none;width:calc(100% - 26px);margin:0;scroll-snap-align:start}
.heroes .hero:only-child{width:100%}
.hero-dots{display:flex;justify-content:center;gap:5px;margin:0 0 14px}
.hero-dots i{width:5px;height:5px;border-radius:3px;background:var(--hair);transition:width .25s,background-color .25s}
.hero-dots i.on{width:14px;background:var(--coral)}
.hero{position:relative;margin:6px 16px 6px;border-radius:24px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.hero-empty{display:flex;gap:14px;align-items:center;margin:6px 16px 4px;padding:16px 18px;border-radius:20px;background:var(--card);box-shadow:0 1px 2px rgba(24,26,48,.04)}
.hero-empty .ic{width:40px;height:40px;border-radius:20px;background:#fff6e0;color:var(--gold);display:grid;place-items:center;flex:none}
.hero-empty .ic svg{width:20px;height:20px}
.hero-empty b{display:block;font-size:15px;font-weight:500}
.hero-empty span{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.5}
.hero-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.5);opacity:.5;transform:scale(1.2)}
.hero-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.55),rgba(255,255,255,.15))}
.hero-in{position:relative;display:grid;grid-template-columns:108px 1fr;gap:18px;align-items:center;padding:18px;width:100%}
.hero-poster{width:108px;aspect-ratio:2/3;border-radius:12px;object-fit:cover;background:var(--soft);box-shadow:0 12px 28px rgba(24,26,48,.22)}
.hero-why{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:#a77400;font-weight:500;margin-bottom:4px}
.hero-why svg{width:11px;height:11px;color:var(--gold)}
.hero h2{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.2;margin:0 0 2px;letter-spacing:.02em}
.hero .en{font-family:var(--latin);font-style:italic;color:var(--ink-2);font-size:13px;margin-bottom:10px;line-height:1.3}
.hero .when{font-size:13px;color:var(--ink-2);margin-bottom:10px}
.hero .when b{font-family:var(--num);font-size:20px;font-weight:300;margin:0 1px;color:var(--ink)}
.hero .tks{display:flex;gap:6px;flex-wrap:wrap}
.hero .tk{height:24px}
.hero .tk.ghost{background:rgba(255,255,255,.55);color:var(--dim);box-shadow:inset 0 0 0 .5px rgba(24,26,48,.12)}

/* ---------- 分区标题 ---------- */
.sec{display:flex;align-items:baseline;gap:8px;padding:0 var(--pad);margin:26px 0 10px}
.sec h3{margin:0;font-size:19px;font-weight:600}
.sec .note{color:var(--faint);font-size:12px}
.day{display:flex;align-items:baseline;gap:8px;padding:0 var(--pad);margin:18px 0 8px}
.day .d{font-family:var(--num);font-size:24px;font-weight:200;line-height:1;letter-spacing:-.01em}
.day .w{font-size:13px;color:var(--dim)}
.day .rel{font-size:11px;color:var(--coral-ink);background:var(--coral-bg);border-radius:9px;padding:0 7px;line-height:18px;font-weight:500}

/* ---------- 海报卡 ---------- */
.card{flex:none;width:86px;display:block}
.pw{position:relative;border-radius:10px;overflow:hidden;background:var(--soft);aspect-ratio:2/3;box-shadow:0 1px 2px rgba(24,26,48,.06),0 4px 10px rgba(24,26,48,.06)}
.pw img{width:100%;height:100%;object-fit:cover}
.pw .tk{position:absolute;left:5px;bottom:5px;height:18px;padding:0 6px;font-size:10px;--n:3px}
.pw .tk b{font-size:10.5px}
.pw .star{position:absolute;right:5px;top:5px;width:18px;height:18px;border-radius:9px;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pw .star svg{width:10px;height:10px}
.card .t{font-size:12px;font-weight:500;line-height:1.35;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{font-size:10.5px;color:var(--faint);margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rates{margin-top:2px;gap:6px}
.card .r{font-size:11px;gap:3px}
.card .r svg{width:11px;height:11px}
.card .r.im svg{width:19px}
/* 热映是三列网格，卡片仍然大一点 */
.grid .card .t{font-size:13px;margin-top:8px}
.grid .card .s{font-size:11px}
.grid .pw{border-radius:12px}
.grid .card .r{font-size:12px}
.grid .card .r svg{width:12px;height:12px}
.grid .card .r.im svg{width:21px}

/* ---------- 紧凑行 ---------- */
.rows{margin:0 16px;background:var(--card);border-radius:18px;padding:2px 14px;box-shadow:0 1px 2px rgba(24,26,48,.04)}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--hair);width:100%}
.row:last-child{border-bottom:0}
.row img{width:40px;height:58px;border-radius:7px;object-fit:cover;background:var(--soft)}
.row .t{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--faint);margin-top:2px;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.row .s .rates{gap:7px}
.row .s .r{font-size:12px}
.row .s .r svg{width:12px;height:12px}
.row .s .r.im svg{width:21px}
.row .right{text-align:right;font-size:11px;color:var(--faint);line-height:1.25}
.row .right b{display:block;font-family:var(--num);font-size:15px;color:var(--ink);font-weight:400}
.row .star-i{color:var(--gold);margin-left:4px;font-size:12px}

/* ---------- 热映三列：评分浮在海报左下角 ---------- */
.prate{position:absolute;left:5px;right:5px;bottom:5px;display:flex;gap:3px;flex-wrap:wrap}
.prate span{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px 0 3px;border-radius:9px;background:rgba(16,16,24,.52);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-family:var(--num);font-weight:600;font-size:10.5px;line-height:1}
.prate svg{width:12px;height:12px;flex:none}
.prate .im svg{width:20px;height:11px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:18px 12px;padding:6px var(--pad) 0}
.grid .card{width:auto}

/* ---------- 已开票 ---------- */
.cine{margin:8px 16px 18px;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(24,26,48,.04)}
.cine-h{padding:16px 16px 10px}
.cine-h h3{margin:0;font-size:17px;font-weight:600}
.cine-h p{margin:2px 0 0;color:var(--faint);font-size:12px}
.otk{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;padding:11px 16px;border-top:.5px dashed var(--hair);width:100%}
.otk img{width:46px;height:66px;border-radius:8px;object-fit:cover;background:var(--soft)}
.otk .t{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.otk .s{font-size:12px;color:var(--faint);margin-top:2px}
.otk .first{text-align:right}
.otk .first b{display:block;font-family:var(--num);font-size:22px;font-weight:300;line-height:1;color:var(--coral-ink)}
.otk .first small{font-size:11px;color:var(--faint)}
.cine .none{padding:12px 16px 18px;color:var(--faint);font-size:13px;border-top:.5px dashed var(--hair)}

/* ---------- 动态 ---------- */
.feed{margin:6px 16px 0;background:var(--card);border-radius:20px;padding:4px 14px;box-shadow:0 1px 2px rgba(24,26,48,.04)}
.ev{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:start;padding:13px 0;border-bottom:.5px solid var(--hair);width:100%}
.ev:last-child{border-bottom:0}
.ev .ic{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;background:var(--soft);font-size:14px;color:var(--ink-2)}
.ev .tt{font-weight:500;font-size:15px}
.ev .bd{color:var(--dim);font-size:13px;margin-top:1px;white-space:pre-line}
.ev time{font-family:var(--num);font-size:13px;color:var(--faint);white-space:nowrap;text-align:right;line-height:1.35}
.ev.star{background:var(--coral-bg);border-radius:14px;border-bottom-color:transparent;padding:13px 12px;margin:6px -8px;width:calc(100% + 16px)}
.ev.star .ic{background:var(--coral);color:#fff}
.ev.star .bd{color:var(--ink-2)}
.ev.star + .ev{border-top:0}

.empty{color:var(--dim);text-align:center;padding:60px 30px;font-size:14px}
.more{display:block;margin:14px auto 0;color:var(--ink-2);font-size:13px;padding:9px 18px;border-radius:12px;background:var(--card);box-shadow:0 1px 3px rgba(24,26,48,.06)}
.foot{margin:36px var(--pad) 10px;font-size:11px;color:var(--faint)}
.foot ul{padding:0;margin:6px 0}
.foot li{list-style:none;display:flex;gap:7px;align-items:center;margin:3px 0}
.dot{width:5px;height:5px;border-radius:50%;background:var(--up);flex:none}
.dot.bad{background:var(--warn)}

/* ---------- 详情：海报悬浮在自己的颜色里 ---------- */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .42s cubic-bezier(.22,1,.36,1);visibility:hidden;padding-bottom:calc(30px + var(--sb))}
.sheet.on{transform:none;visibility:visible}
.sbar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;padding:calc(var(--st) + 10px) 14px 0;height:0;overflow:visible}
.sbar button{height:34px;padding:0 13px;border-radius:17px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8);color:var(--ink);font-size:14px;font-weight:500;display:flex;align-items:center;gap:5px;box-shadow:0 2px 10px rgba(24,26,48,.08)}
.sbar button svg{width:15px;height:15px}
.sbar .fav svg{color:var(--faint)}
.sbar .fav[aria-pressed=true]{background:var(--coral);color:#fff}
.sbar .fav[aria-pressed=true] svg{color:#fff}
.cover{position:relative;margin-top:calc(-10px - var(--st));padding:calc(var(--st) + 64px) 0 0;overflow:hidden;text-align:center}
.cover-bg{position:absolute;left:-40px;right:-40px;top:-40px;bottom:0;background-size:cover;background-position:center;filter:blur(46px) saturate(1.6);opacity:.5;transform:scale(1.15);
  -webkit-mask:linear-gradient(#000 35%,transparent 92%);mask:linear-gradient(#000 35%,transparent 92%)}
.cover-poster{position:relative;width:184px;aspect-ratio:2/3;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--soft) center/cover no-repeat;box-shadow:0 24px 50px rgba(24,26,48,.28),0 2px 6px rgba(24,26,48,.1)}
.cover-poster img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.cover-poster img.ok{opacity:1}
.cover-t{position:relative;padding:22px var(--pad) 0}
.cover-t h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.2;margin:0;letter-spacing:.03em}
.cover-t .en{font-family:var(--latin);font-style:italic;font-size:15px;color:var(--dim);margin-top:4px}
.dmeta{padding:8px var(--pad) 0;color:var(--dim);font-size:13px;line-height:1.6;text-align:center}
.dmeta .cd{color:var(--ink);font-weight:500}
.dtks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px var(--pad) 0}
.scores3{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 16px 0;background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(24,26,48,.04)}
.scores3 a{padding:16px 4px 14px;text-align:center}
.scores3 a+a{border-left:.5px solid var(--hair)}
.scores3 .lg{height:16px;display:flex;justify-content:center;align-items:center;margin-bottom:6px}
.scores3 .lg svg{height:15px;width:auto}
.scores3 b{display:block;font-family:var(--num);font-size:34px;font-weight:200;line-height:1;letter-spacing:-.02em}
.scores3 b.no{font-family:var(--sans);font-size:14px;font-weight:400;color:var(--faint);line-height:34px}
.scores3 small{display:block;font-size:11px;color:var(--faint);margin-top:5px}
.wishbox{margin:10px 16px 0;padding:16px 18px;background:var(--card);border-radius:20px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center;box-shadow:0 1px 2px rgba(24,26,48,.04)}
.wishbox .big{font-family:var(--num);font-size:28px;font-weight:200;line-height:1;letter-spacing:-.01em}
.u{font-family:var(--sans);font-size:.5em;font-weight:400;margin-left:2px;color:var(--dim)}
.wishbox .lab{font-size:12px;color:var(--faint);margin-top:4px}
.wishbox .d{color:var(--up);font-weight:500}
.wishbox svg{width:100%;height:42px}
.blk{margin:26px var(--pad) 0}
.blk h4{margin:0 0 10px;font-size:12px;color:var(--faint);font-weight:500;letter-spacing:.04em}
.dra{margin:0;font-size:15px;line-height:1.9;color:var(--ink-2)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:14px}
.dl dt{color:var(--faint)}
.dl dd{margin:0;color:var(--ink-2)}
.cines{display:grid;gap:8px}
.cl{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-radius:16px;background:var(--card);box-shadow:0 1px 2px rgba(24,26,48,.04)}
.cl .n{font-weight:500}
.cl .i{font-size:12px;color:var(--faint);text-align:right;line-height:1.45}
.cl.open{background:var(--coral-bg);box-shadow:inset 0 0 0 .5px var(--coral-line)}
.cl.open .i{color:var(--coral-ink)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{padding:9px 15px;border-radius:14px;background:var(--card);font-size:13px;font-weight:500;color:var(--ink-2);box-shadow:0 1px 3px rgba(24,26,48,.06)}
.links a:first-child{background:var(--coral);color:#fff}

/* ---------- 设置 ---------- */
.set .sheet-bar{position:sticky;top:0;z-index:2;padding:calc(var(--st) + 10px) 14px 6px;background:rgba(246,246,249,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.set .sheet-bar button{height:34px;padding:0 16px;border-radius:17px;background:var(--card);font-weight:500;box-shadow:0 1px 3px rgba(24,26,48,.08)}
.set h2{font-size:28px;font-weight:600;margin:6px var(--pad) 4px}
.set .lead{color:var(--dim);font-size:14px;margin:0 var(--pad) 6px}
.set .block{margin:24px 16px 0;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(24,26,48,.04)}
.set .block h3{font-size:16px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.set .block p{color:var(--dim);font-size:13px;margin:0 0 8px}
.state{font-size:11px;border-radius:7px;padding:1px 8px;background:var(--soft);color:var(--dim);font-weight:500}
.state.ok{background:#e6f6ee;color:var(--up)}
.steps{margin:0 0 12px;padding-left:20px;font-size:13px;line-height:1.8;color:var(--ink-2)}
.steps a{color:var(--coral-ink);text-decoration:underline;text-underline-offset:2px}
.steps code{background:var(--soft);border-radius:5px;padding:1px 5px;font-size:12px}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;background:var(--bg);border:.5px solid var(--hair);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;white-space:nowrap;min-height:44px;padding:0 20px;border-radius:14px;
  background:linear-gradient(180deg,#ff7d52,#ff5c2b);color:#fff;font-weight:600;font-size:15px;letter-spacing:.02em;
  box-shadow:0 6px 16px rgba(255,92,43,.26),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .18s cubic-bezier(.3,.7,.4,1),box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.96);box-shadow:0 3px 8px rgba(255,92,43,.22),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.ghost{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(24,26,48,.08),inset 0 0 0 .5px var(--hair)}
.btn.ghost:active{box-shadow:0 1px 2px rgba(24,26,48,.06),inset 0 0 0 .5px var(--hair)}
.btn:disabled{opacity:.55}
.more,.chip,.rec-again,.tabs button,.sbar button,.icon-btn{text-align:center}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%}
.choice:last-child{margin-bottom:0}
.choice input{accent-color:var(--coral);margin-top:3px;width:17px;height:17px}
.choice small{display:block;color:var(--faint);font-size:12px}
.starlist{display:grid;gap:0}
.starlist div{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid var(--hair)}
.starlist div:last-child{border-bottom:0}
.starlist button{color:var(--coral-ink);font-size:13px}
.err{color:var(--warn);font-size:13px;margin-top:8px}
.tip{color:var(--faint);font-size:12px;margin:26px var(--pad) 30px;text-align:center}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + var(--sb));z-index:20;background:rgba(28,29,36,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;border-radius:16px;padding:13px 16px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 40px rgba(24,26,48,.25);transform:translateY(14px) scale(.98);opacity:0;pointer-events:none;transition:opacity .22s,transform .3s cubic-bezier(.22,1,.36,1)}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast span{flex:1}
.toast button{font-weight:600;color:#ffb199;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= 票夹 ================= */
.cta{display:flex;gap:8px;justify-content:center;padding:16px var(--pad) 0}
.rec-btn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 20px;border-radius:21px;background:var(--ink);color:#fff;font-size:14px;font-weight:500;box-shadow:0 8px 20px rgba(24,26,48,.2);transition:transform .18s}
.rec-btn:active{transform:scale(.96)}
.rec-btn svg{width:16px;height:16px}
.seen{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;height:46px;padding:0 16px;border-radius:15px;background:var(--card);font-size:12px;color:var(--dim);box-shadow:0 1px 3px rgba(24,26,48,.06);line-height:1.3}
.seen span{font-size:14px;font-weight:500;color:var(--ink)}
.rec-again{height:46px;padding:0 16px;border-radius:15px;background:var(--soft);font-size:13px;color:var(--ink-2)}

/* ---------- 票根（横 / 竖） ---------- */
.stub-wrap{min-width:0;filter:drop-shadow(0 1px 1px rgba(24,26,48,.05)) drop-shadow(0 10px 18px rgba(24,26,48,.10));cursor:pointer;transition:transform .2s cubic-bezier(.3,.7,.4,1)}
.stub-wrap:active{transform:scale(.98)}
.stub{--tint:#fff1ea;--acc:#d9481c;--sh:.5;--tw:82px;--vt:74px;position:relative;width:100%;border-radius:14px;text-align:left;overflow:hidden;
  background:linear-gradient(105deg,var(--tint) 0%,#fff 82%)}
.stub.h{display:flex;height:158px;
  -webkit-mask:radial-gradient(circle 8px at calc(100% - var(--tw)) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 8px at calc(100% - var(--tw)) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle 8px at calc(100% - var(--tw)) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 8px at calc(100% - var(--tw)) 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
.stub.v{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--tint) 0%,#fff 75%);
  -webkit-mask:radial-gradient(circle 8px at 0 calc(100% - var(--vt)),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% calc(100% - var(--vt)),#0000 97%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 8px at 0 calc(100% - var(--vt)),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% calc(100% - var(--vt)),#0000 97%,#000) right/51% 100% no-repeat}
.paper,.sheen{position:absolute;inset:0;pointer-events:none}
.paper{z-index:0}
.stub.h .paper{-webkit-mask:linear-gradient(90deg,transparent 22%,#000 42%);mask:linear-gradient(90deg,transparent 22%,#000 42%)}
.stub.v .paper{-webkit-mask:linear-gradient(180deg,transparent 50%,#000 66%);mask:linear-gradient(180deg,transparent 50%,#000 66%)}
.sheen{z-index:4;background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.7) 48%,rgba(255,255,255,.15) 54%,transparent 62%);
  background-size:280% 100%;background-position:calc((1 - var(--sh)) * 100%) 0;mix-blend-mode:soft-light}
/* 按类型换纸纹 */
.g-fun .paper{background:radial-gradient(circle at 2px 2px,color-mix(in srgb,var(--acc) 20%,transparent) 1.3px,transparent 1.8px) 0 0/11px 11px}
.g-scifi .paper{background:linear-gradient(color-mix(in srgb,var(--acc) 12%,transparent) 1px,transparent 1px) 0 0/14px 14px,linear-gradient(90deg,color-mix(in srgb,var(--acc) 12%,transparent) 1px,transparent 1px) 0 0/14px 14px}
.g-dark .paper{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--acc) 15%,transparent) 0 1px,transparent 1px 7px)}
.g-action .paper{background:repeating-linear-gradient(-28deg,color-mix(in srgb,var(--acc) 8%,transparent) 0 9px,transparent 9px 22px)}
.g-docu .paper{background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--acc) 14%,transparent) 0 1px,transparent 1px 13px)}
.g-tender .paper{background:radial-gradient(circle at 3px 5px,color-mix(in srgb,var(--acc) 11%,transparent) .8px,transparent 1.2px) 0 0/9px 8px,radial-gradient(circle at 7px 2px,color-mix(in srgb,var(--acc) 8%,transparent) .7px,transparent 1.1px) 0 0/13px 11px}

.stub-main{position:relative;z-index:1;flex:1;min-width:0;display:flex;gap:12px;padding:13px}
.stub-p{width:86px;height:129px;border-radius:7px;object-fit:cover;flex:none;background:var(--soft);box-shadow:0 4px 12px rgba(24,26,48,.2)}
.stub-info{min-width:0;flex:1;display:flex;flex-direction:column}
.stub-t{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.22;letter-spacing:.02em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stub-en{font-family:var(--latin);font-style:italic;font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stub-d{margin-top:auto;display:flex;gap:5px;align-items:baseline}
.stub-d b{font-family:var(--num);font-weight:300;font-size:16px;letter-spacing:.03em;line-height:1.2}
.stub-d span{font-size:10.5px;color:var(--dim)}
.stub-c{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.stub-n{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.stub-tail{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.55)}
.stub.h .stub-tail{width:var(--tw);border-left:1.5px dashed rgba(24,26,48,.16);padding:6px 4px}
.tl-k{font-size:8.5px;color:var(--faint);letter-spacing:.14em}
.tl-no{font-family:var(--num);font-weight:200;font-size:27px;line-height:1;color:var(--acc);margin-top:1px}
.tl-r{font-size:9px;color:var(--gold);letter-spacing:.5px;margin-top:4px;white-space:nowrap}
.tl-r.no{color:var(--faint);letter-spacing:0}
.bars{display:flex;height:18px;margin-top:6px}
.bars i{display:block;height:100%;background:var(--ink);opacity:.72}
.tl-code{font-family:var(--num);font-size:7.5px;letter-spacing:.06em;color:var(--dim);margin-top:2px;white-space:nowrap}
.sp-tag{font-size:8.5px;font-weight:700;letter-spacing:.12em;color:var(--acc);margin-bottom:2px}

/* 竖版 */
.stub.v .stub-main{flex-direction:column;gap:0;padding:10px 10px 9px}
.stub.v .stub-p{width:100%;height:auto;aspect-ratio:4/5;border-radius:8px}
.stub.v .stub-info{flex:none;padding:9px 2px 0;height:98px;overflow:hidden}
.stub.v .stub-t{font-size:15.5px;-webkit-line-clamp:1;display:block;white-space:nowrap;text-overflow:ellipsis}
.stub.v .stub-en{font-size:10px}
.stub.v .stub-d{margin-top:6px}
.stub.v .stub-d b{font-size:13px}
.stub.v .stub-c{font-size:10px}
.stub.v .stub-n{font-size:10px}
.stub.v .stub-tail{height:var(--vt);flex-direction:row;justify-content:space-between;align-items:center;border-top:1.5px dashed rgba(24,26,48,.16);padding:0 12px}
.stub.v .tl-left{display:flex;flex-direction:column;align-items:flex-start}
.stub.v .tl-right{display:flex;flex-direction:column;align-items:flex-end}
.stub.v .tl-no{font-size:24px}
.stub.v .tl-r{margin-top:0}
.stub.v .bars{height:16px;margin-top:4px}

/* 印章：压在撕票线上，微微倾斜 */
.stamp{position:absolute;z-index:3;width:54px;height:54px;border-radius:50%;border:2px solid rgba(229,72,77,.78);color:rgba(229,72,77,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:2px;transform:rotate(-10deg);
  box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.45),inset 0 0 0 3.5px rgba(229,72,77,.45);mix-blend-mode:multiply;pointer-events:none}
.stamp small{font-size:8px;letter-spacing:0;font-weight:500}
.stub.h .stamp{left:calc(100% - var(--tw) - 44px);bottom:6px}
.stub.v .stamp{right:10px;bottom:calc(var(--vt) - 10px)}
.stamping .stamp{animation:stamp .55s cubic-bezier(.3,1.5,.5,1) .5s both}
.stub-wrap.stamping{animation:slidein .55s cubic-bezier(.22,1,.36,1) both}
.stamping .sheen{animation:sweep 1.4s ease .9s both}
@keyframes stamp{0%{transform:rotate(-10deg) scale(2.4);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}
@keyframes slidein{0%{transform:translateY(26px) scale(.95);opacity:0}100%{transform:none;opacity:1}}
@keyframes sweep{0%{background-position:100% 0}100%{background-position:0 0}}

/* 限定纸：第 10 张镭射、第 50 张黑卡烫金、每 100 张硫酸纸 */
.stub.sp-holo{background:linear-gradient(115deg,#ffe1f0,#dcefff 22%,#e3fde0 42%,#fff3cc 62%,#ead9ff 82%,#ffe1f0);background-size:240% 100%;background-position:calc(var(--sh) * 100%) 0}
.sp-holo .sheen{mix-blend-mode:overlay;opacity:1}
.sp-holo .stub-tail{background:rgba(255,255,255,.35)}
.stub.sp-gold{background:radial-gradient(120% 90% at 15% 0%,#2c2932,#141318 70%)}
.sp-gold .stub-t,.sp-gold .stub-d b,.sp-gold .tl-no{background:linear-gradient(180deg,#f6e2ad,#b98f45);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-gold .stub-en,.sp-gold .stub-d span,.sp-gold .stub-c,.sp-gold .stub-n,.sp-gold .tl-k,.sp-gold .tl-code{color:rgba(232,207,152,.7)}
.sp-gold .stub-tail{background:rgba(255,255,255,.03);border-color:rgba(232,207,152,.3)!important}
.sp-gold .bars i{background:#d8b56c;opacity:.9}
.sp-gold .sp-tag{color:#e8cf98}
.sp-gold .stamp{border-color:rgba(216,181,108,.9);color:#d8b56c;mix-blend-mode:normal;box-shadow:inset 0 0 0 2.5px rgba(0,0,0,.2),inset 0 0 0 3.5px rgba(216,181,108,.5)}
.sp-gold .sheen{background:linear-gradient(115deg,transparent 38%,rgba(255,226,160,.35) 50%,transparent 62%);background-size:280% 100%;background-position:calc((1 - var(--sh)) * 100%) 0;mix-blend-mode:screen}
.sp-gold .paper{display:none}
.stub.stub.sp-vellum{background:linear-gradient(105deg,rgba(255,255,255,.66),rgba(255,255,255,.4));-webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.sp-vellum .paper{background:repeating-linear-gradient(95deg,rgba(24,26,48,.035) 0 1px,transparent 1px 5px)!important;-webkit-mask:none;mask:none}
.sp-vellum .stub-tail{background:rgba(255,255,255,.25)}
.vellum-under{position:absolute;inset:6px;border-radius:14px;background-size:cover;background-position:center;filter:blur(18px) saturate(1.4);opacity:.55;z-index:-1}

/* ---------- 票夹页 ---------- */
.wstats{display:grid;grid-template-columns:repeat(3,1fr);margin:4px 16px 0;background:var(--card);border-radius:20px;padding:16px 4px;box-shadow:0 1px 2px rgba(24,26,48,.04)}
.wstats div{text-align:center}
.wstats div+div{border-left:.5px solid var(--hair)}
.wstats b{display:block;font-family:var(--num);font-weight:200;font-size:34px;line-height:1}
.wstats span{font-size:11px;color:var(--faint)}
.sec-more{margin-left:auto;font-size:13px;color:var(--coral-ink)}
.seg{margin-left:auto;display:flex;background:var(--soft);border-radius:9px;padding:2px}
.seg button{height:26px;padding:0 12px;border-radius:7px;font-size:12px;color:var(--dim);transition:background-color .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(24,26,48,.1)}
.stubs{display:grid;gap:16px;padding:0 16px}
.stubs.vmode{grid-template-columns:1fr 1fr;gap:16px 12px}
.badges{gap:6px;padding-bottom:8px}
.badge{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mw{position:relative;width:58px;height:58px}
.medal{--h:20;position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:27px;
  background:radial-gradient(circle at 32% 26%,hsl(var(--h) 95% 96%),hsl(var(--h) 85% 81%) 68%,hsl(var(--h) 70% 70%));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),inset 0 -3px 6px hsla(var(--h),60%,40%,.15),0 6px 14px hsla(var(--h),70%,50%,.25)}
/* 未解锁：银白浮雕 */
.badge:not(.ok) .medal{background:linear-gradient(150deg,#ffffff,#eceef3 60%,#e2e5ec);
  box-shadow:inset 0 0 0 1px rgba(24,26,48,.07),inset 0 2px 2px #fff,inset 0 -2px 5px rgba(24,26,48,.07),0 1px 2px rgba(24,26,48,.04)}
.badge:not(.ok) .medal .em{filter:grayscale(1) contrast(.7) brightness(1.15);opacity:.32}
.bn{font-size:11px;font-weight:500;margin-top:7px;line-height:1.3}
.bp{font-size:10px;color:var(--faint)}
.badge:not(.ok) .bn{color:var(--dim)}
.wallet-empty{margin:18px 16px 0;padding:28px 22px;border-radius:20px;background:var(--card);text-align:center;color:var(--dim);font-size:13px;line-height:1.7;box-shadow:0 1px 2px rgba(24,26,48,.04)}
.wallet-empty .ghost-stub{margin:0 auto 16px;width:210px;height:84px;border-radius:10px;border:1.5px dashed var(--hair);display:grid;place-items:center;color:var(--faint);font-size:12px}
.hint{color:var(--faint);font-size:12px;text-align:center;margin:20px 30px 0}

/* ---------- 记录观影：底部弹出 ---------- */
.rec{position:fixed;inset:0;z-index:30;visibility:hidden}
.rec.on{visibility:visible}
.rec-back{position:absolute;inset:0;background:rgba(24,26,48,.28);opacity:0;transition:opacity .3s}
.rec.on .rec-back{opacity:1}
.rec-panel{--tint:transparent;position:absolute;left:0;right:0;bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--sb));
  background:radial-gradient(130% 55% at 12% 0%,var(--tint),transparent 62%),var(--bg);transition:transform .45s cubic-bezier(.22,1,.36,1),background-color .4s;
  transform:translateY(100%);max-height:92vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(24,26,48,.15)}
.rec.on .rec-panel{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(24,26,48,.12);margin:0 auto 12px}
.rec h3{margin:0;font-size:20px;font-weight:600}
.rec .rec-mv{margin:2px 0 14px;color:var(--dim);font-size:13px}
.f{display:block;background:rgba(255,255,255,.88);border-radius:15px;padding:10px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(24,26,48,.04)}
.f > span{display:block;font-size:11px;color:var(--faint);margin-bottom:4px}
.f input{width:100%;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:2px 0;outline:none;-webkit-appearance:none;appearance:none;min-height:26px}
.f input::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 13px;border-radius:16px;background:var(--soft);font-size:13px;color:var(--ink-2);transition:transform .18s,background-color .2s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--coral-bg);color:var(--coral-ink);box-shadow:inset 0 0 0 1px var(--coral-line);font-weight:500}
#rOther{margin-top:8px;border-top:.5px solid var(--hair);padding-top:8px}
.rstars{display:flex;gap:6px;align-items:center}
.rstars button{font-size:29px;line-height:1;color:#e4e6ec}
.rstars button.on{color:var(--gold)}
.rstars button.pop{animation:starpop .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes starpop{0%{transform:scale(.7)}55%{transform:scale(1.3) rotate(-8deg)}100%{transform:none}}
.rstars .lab{font-size:12px;color:var(--faint);margin-left:6px}
.btn.wide{width:100%;margin-top:10px;height:50px;border-radius:15px;font-size:16px}

/* ---------- 弹窗：票根 / 成就 ---------- */
.reveal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;visibility:hidden}
.reveal.on{visibility:visible}
.rv-back{--t1:#ffe3d6;--t2:#e3ecff;position:absolute;inset:0;opacity:0;transition:opacity .35s;
  background:radial-gradient(70% 45% at 20% 18%,var(--t1),transparent 70%),radial-gradient(60% 45% at 85% 80%,var(--t2),transparent 70%),rgba(246,246,249,.78);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4)}
.reveal.on .rv-back{opacity:1}
.rv-in{position:relative;width:100%;max-width:440px;padding:0 18px;max-height:100vh;overflow-y:auto;padding-top:calc(var(--st) + 24px);padding-bottom:calc(var(--sb) + 24px)}
.rv-h{text-align:center;margin-bottom:18px}
.rv-h b{display:block;font-size:21px;font-weight:600}
.rv-h span{font-size:13px;color:var(--dim)}
.rv-h .seg{display:inline-flex;margin:10px auto 0}
.rv-stub.vmode{width:62%;margin:0 auto}
.rv-badges{margin-top:22px;display:grid;gap:8px}
.rv-badge{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.92);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.rv-badge .mw,.rv-badge .medal{width:48px;height:48px;flex:none}
.rv-badge .em{font-size:24px;line-height:1}
.bdetail .em{font-size:54px;line-height:1}
.medal .em{line-height:1}
.rv-badge .medal{animation:lightup 1s cubic-bezier(.3,1.4,.5,1) both;animation-delay:inherit}
.rv-badge .mw:before{content:"";position:absolute;inset:-14px;border-radius:50%;background:repeating-conic-gradient(from 0deg,hsla(var(--h),95%,62%,.35) 0 8deg,transparent 8deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:rays 1.6s ease-out both;animation-delay:inherit}
.rv-badge b{display:block;font-size:15px;font-weight:600}
.rv-badge span{font-size:12px;color:var(--dim)}
.rv-badge em{font-style:normal;font-size:10px;color:var(--coral-ink);background:var(--coral-bg);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
@keyframes pop{0%{transform:scale(.6) translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@keyframes lightup{0%{filter:grayscale(1) brightness(1.15);transform:scale(.7)}50%{filter:grayscale(0) brightness(1.15);transform:scale(1.22);box-shadow:inset 0 0 0 2px #fff,0 0 0 8px hsla(var(--h),90%,70%,.25),0 0 26px hsla(var(--h),90%,60%,.7)}100%{filter:none;transform:none}}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.5)}30%{opacity:1}100%{opacity:0;transform:rotate(90deg) scale(1.2)}}
.rv-actions{display:flex;gap:10px;margin-top:22px}
.rv-actions .btn{flex:1;height:48px}
.rv-del{display:block;margin:16px auto 0;font-size:13px;color:var(--warn);text-align:center}
.rv-img{width:100%;border-radius:12px}
.burst{position:absolute;left:50%;top:34%;pointer-events:none;z-index:5}
.burst i{position:absolute;width:7px;height:7px;border-radius:2px;opacity:0;animation:fly 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px;margin:6px 0 0}
.bgrid .badge{width:auto}
.bgrid .bd{font-size:10px;color:var(--faint);line-height:1.35;margin-top:2px;padding:0 4px}
.pbar{width:50px;height:3px;border-radius:2px;background:rgba(24,26,48,.08);margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--coral);border-radius:2px}
/* 单个成就详情 */
.bdetail{text-align:center;padding:10px 0 4px}
.bdetail .mw,.bdetail .medal{width:110px;height:110px;font-size:52px;margin:0 auto}
.bdetail .badge{width:auto}
.bdetail h4{margin:18px 0 4px;font-size:22px;font-weight:600}
.bdetail p{margin:0;color:var(--dim);font-size:14px}
.bdetail .goal{margin:18px auto 0;max-width:280px;background:rgba(255,255,255,.9);border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px rgba(24,26,48,.06);text-align:left}
.bdetail .goal b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.bdetail .goal small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.bdetail .goal .pbar{width:100%;height:5px;margin-top:10px}
.bdetail .done{color:var(--up);font-weight:600}
@media (prefers-reduced-motion:reduce){.stub-wrap,.stamp,.sheen,.rv-badge,.medal,.mw:before{animation:none!important}}

</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-row">
    <div style="flex:1;min-width:0"><h1 id="title">即将上映</h1><div class="sub" id="sub">加载中…</div></div>
    <button class="icon-btn" id="searchBtn" aria-label="搜索" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <button class="icon-btn" id="openSettings" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
  <div class="searchbox" id="searchbox"><input id="q" type="search" placeholder="片名、导演、演员" autocomplete="off" enterkeyhint="search"></div>
</header>

<main id="main"></main>

<div class="tabfade"></div>
<nav class="tabs" role="tablist"><span class="tab-ind" id="tabInd"></span>
  <button role="tab" data-tab="coming" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>待映</button>
  <button role="tab" data-tab="opened" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8.5a2 2 0 0 0 0 4v0a2 2 0 0 0 0 4V19h18v-2.5a2 2 0 0 1 0-4 2 2 0 0 1 0-4V6H3z" transform="translate(0 -.5)"/><path d="M15 7v11" stroke-dasharray="1.5 2.5"/></svg>已开票</button>
  <button role="tab" data-tab="now" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>热映</button>
  <button role="tab" data-tab="wallet" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="12" rx="2.5"/><path d="M6 8V6.5A1.5 1.5 0 0 1 7.5 5h9A1.5 1.5 0 0 1 18 6.5V8"/><path d="M8 5V3.8M16 5V3.8"/><path d="M3.5 13h17" stroke-dasharray="1.5 2.5"/></svg>票夹</button>
  <button role="tab" data-tab="feed" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 10a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 15 6 10"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>动态<span class="n" id="feedBadge" hidden></span></button>
</nav>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="电影详情"></section>
<section class="sheet set" id="settings" role="dialog" aria-modal="true" aria-label="推送设置"></section>
<div class="rec" id="rec"></div>
<div class="reveal" id="reveal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span></span><button hidden></button></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WK = "日一二三四五六";
function getPref(k, d){ try { const v = localStorage.getItem("radar." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function setPref(k, v){ try { localStorage.setItem("radar." + k, JSON.stringify(v)); } catch {} }
const S = { tab: "coming", q: "", limit: 60, data: null, hist: {}, events: [], status: {},
  local: new Set(getPref("favs", []).map(String)), watch: null, sha: null };

/* ---------- 小工具 ---------- */
function wan(n){ if (n == null) return "–"; if (n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,"") + "亿"; if (n >= 1e4) return (n/1e4).toFixed(1).replace(/\.0$/,"") + "万"; return String(n); }
function wanH(n){ const s = wan(n); const m = /^([\d.]+)(万|亿)?$/.exec(s); return m ? `${m[1]}${m[2] ? `<small class="u">${m[2]}</small>` : ""}` : esc(s); }
function signed(n){ return !n ? "" : (n > 0 ? "+" : "-") + wan(Math.abs(n)); }
function ymd(d){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? [+m[1], +m[2], +m[3]] : null; }
function todayYmd(){ return ymd(new Date().toLocaleDateString("en-CA", {timeZone:"Asia/Shanghai"})); }
function daysTo(d){ const x = ymd(d), t = todayYmd(); return x ? Math.round((Date.UTC(x[0],x[1]-1,x[2]) - Date.UTC(t[0],t[1]-1,t[2])) / 864e5) : null; }
function md(d){ const x = ymd(d); return x ? `${x[1]}.${String(x[2]).padStart(2,"0")}` : ""; }
function mdc(d){ const x = ymd(d); return x ? `${x[1]}月${x[2]}日` : (d || ""); }
function wk(d){ const x = ymd(d); return x ? "周" + WK[new Date(Date.UTC(x[0], x[1]-1, x[2])).getUTCDay()] : ""; }
function relWord(n){ return n === 0 ? "今天" : n === 1 ? "明天" : n === 2 ? "后天" : n > 0 && n < 7 ? `${n} 天后` : ""; }
function ago(iso){ if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (m < 1) return "刚刚"; if (m < 60) return m + " 分钟前"; const h = Math.round(m/60); if (h < 24) return h + " 小时前"; return Math.round(h/24) + " 天前"; }
function hm(iso){ return new Date(iso).toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}); }
function big(url, w){ return (url || "").replace(/thumbnail\/\d+x\/quality\/\d+/, `thumbnail/${w}x/format/webp/quality/80`); }
function rtKey(rt){ if (!rt) return "9999-99-99"; if (rt.length === 4) return rt + "-99-99"; if (rt.length === 7) return rt + "-99"; return rt; }

function starIds(){
  if (S.watch) return new Set(S.watch.stars.map(x => String(x.id)));
  return new Set([...(S.data && S.data.stars || []).map(String), ...S.local]);
}
const isFav = m => S.watch ? starIds().has(String(m.id)) : (starIds().has(String(m.id)) || m.watch);
const openedAt = m => m.unreleased ? S.data.cinemas.map(c => [c, (m.opened || {})[String(c.id)]]).filter(x => x[1]) : [];

/* ---------- 图标 ---------- */
const IC = {
  db: `<svg viewBox="0 0 16 16"><rect width="16" height="16" rx="4" fill="#00b51d"/><text x="8" y="12.2" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff" font-family="PingFang SC,sans-serif">豆</text></svg>`,
  im: `<svg viewBox="0 0 28 14"><rect width="28" height="14" rx="3" fill="#f5c518"/><text x="14" y="10.6" font-size="9" font-weight="900" text-anchor="middle" fill="#000" font-family="Helvetica Neue,Arial,sans-serif" letter-spacing="-.2">IMDb</text></svg>`,
  tm: `<svg viewBox="0 0 16 16"><circle cx="8" cy="9" r="6.6" fill="#fa320a"/><path d="M8 3.2c-.3-1.4-1.3-2-2.6-2 .9.6 1.3 1.2 1.4 2-1.1-.6-2.2-.5-3 .3 1.1 0 1.9.3 2.4.9" fill="none" stroke="#00912d" stroke-width="1.4" stroke-linecap="round"/><path d="M8.2 3.6c.9-.9 2.1-1 3.2-.5-.9.2-1.5.6-1.8 1.2" fill="none" stroke="#00912d" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  star: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5 6 20.8l1.3-6.7-5-4.6 6.8-.8z"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
};
function val(k, m){
  if (k === "db") return m.douban && m.douban.sc > 0 ? m.douban.sc.toFixed(1) : null;
  if (k === "im") return m.imdb && m.imdb.sc ? m.imdb.sc.toFixed(1) : null;
  if (k === "tm") return m.tomato && m.tomato.critics != null ? m.tomato.critics + "%" : null;
}
function rates(m){ const h = ["db","im","tm"].map(k => { const v = val(k, m); return v ? `<span class="r ${k}">${IC[k]}${v}</span>` : ""; }).join(""); return h ? `<div class="rates">${h}</div>` : ""; }
function tiny(c){ const w = c.short.split(/\s+/)[0]; return /[\u4e00-\u9fff]/.test(w) ? w.slice(0, 2) : w; }
function tkMini(o){ const first = o.map(x => x[1].first).sort()[0], fresh = o.some(x => x[1].at && Date.now() - new Date(x[1].at) < 864e5);
  return `<span class="tk${fresh ? " new" : ""}">${o.length > 1 ? o.length + " 家" : esc(tiny(o[0][0]))} <b>${md(first)}</b></span>`; }
function tk(c, o, cls = ""){ const fresh = o.at && Date.now() - new Date(o.at) < 864e5;
  return `<span class="tk ${cls}${fresh ? " new" : ""}">${esc(c.short)} <b>${md(o.first)}</b></span>`; }

/* ---------- 数据 ---------- */
async function load(){
  if (window.__RADAR__) { apply(window.__RADAR__); return; }
  const t = Date.now();
  const get = f => fetch(`data/${f}?t=${t}`, {cache:"no-store"}).then(r => r.ok ? r.json() : null).catch(() => null);
  const [movies, hist, events, status] = await Promise.all(["movies.json","history.json","events.json","status.json"].map(get));
  if (!movies) { $("#sub").textContent = "还没有数据"; $("#main").innerHTML =
    `<p class="empty">数据还没生成。到 GitHub 仓库的 Actions 里运行一次"更新电影数据"，几分钟后再刷新。</p>`; return; }
  apply({movies, hist, events, status});
}
function apply(d){
  S.data = d.movies; S.hist = d.hist || {}; S.events = d.events || []; S.status = (d.status && d.status.sources) || {};
  const unread = S.events.filter(e => e.at > getPref("feedSeen", "") && e.type !== "system").length;
  const b = $("#feedBadge"); b.hidden = !unread; b.textContent = unread > 9 ? "9+" : unread;
  render();
  const m = location.hash.match(/^#m(\d+)/); if (m) openMovie(m[1], false);
  if (gh.token() && !S.watch) { syncStars(); syncDiary(); }
}

/* ---------- 组件 ---------- */
function miniRates(m){ return ["db","im","tm"].map(k => { const v = val(k, m); return v ? `<span class="${k}">${IC[k]}${v}</span>` : ""; }).join(""); }
function card(m, opt = {}){
  const o = openedAt(m);
  const sub = opt.sub != null ? opt.sub : (m.unreleased ? `${wan(m.wish.maoyan)} 人想看` : "");
  const r = rates(m);
  return `<button class="card${opt.lg ? " lg" : ""}" data-id="${m.id}">
    <div class="pw"><img loading="lazy" src="${esc(m.img)}" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=0">
      ${isFav(m) ? `<span class="star">${IC.star}</span>` : ""}${o.length ? tkMini(o) : ""}${opt.overlay ? `<div class="prate">${miniRates(m)}</div>` : ""}</div>
    <div class="t">${esc(m.nm)}</div>
    ${opt.overlay ? "" : r && !m.unreleased ? r : `<div class="s">${esc(sub)}</div>${r}`}
  </button>`;
}
function row(m){
  const n = daysTo(m.rt), o = openedAt(m);
  const when = m.rt && m.rt.length === 10 ? `${md(m.rt)} ${wk(m.rt)}` : m.rt && m.rt.length === 7 ? `${+m.rt.slice(5)}月` : "待定";
  return `<button class="row" data-id="${m.id}">
    <img loading="lazy" src="${esc(m.img)}" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=0">
    <div style="min-width:0"><div class="t">${esc(m.nm)}${isFav(m) ? `<span class="star-i">★</span>` : ""}</div>
      <div class="s">${m.unreleased ? `<span>${esc(when)}</span>` : ""}${o.length ? tk(o[0][0], o[0][1]) : ""}${rates(m)}</div></div>
    <div class="right"><b>${wanH(m.wish.maoyan)}</b>想看</div>
  </button>`;
}
function match(m){
  if (!S.q) return true;
  const hay = [m.nm, m.enm, m.dir, m.star, m.cat].join(" ").toLowerCase();
  return S.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function heroBlock(m){
  const n = daysTo(m.rt), o = openedAt(m);
  const why = `${IC.star}星标`;
  const when = !(m.rt && m.rt.length === 10) ? (m.rt ? `${m.rt.length === 7 ? +m.rt.slice(5) + "月" : m.rt + "年"}上映，具体日期待定` : "上映日期待定")
    : n === 0 ? `今天上映` : `<b>${n}</b>天后上映，${mdc(m.rt)} ${wk(m.rt)}`;
  return `<section class="hero"><div class="hero-bg" style="background-image:url('${esc(m.img)}')"></div>
    <button class="hero-in" data-id="${m.id}">
      <img class="hero-poster" src="${esc(m.img)}" alt="" referrerpolicy="no-referrer">
      <div><div class="hero-why">${why}</div><h2>${esc(m.nm)}</h2>${m.enm ? `<div class="en">${esc(m.enm)}</div>` : ""}
        <div class="when">${when}</div>
        <div class="tks">${S.data.cinemas.map(c => { const x = (m.opened || {})[String(c.id)];
          return x ? tk(c, x) : `<span class="tk ghost">${esc(c.short)} 未开票</span>`; }).join("")}</div></div>
    </button></section>`;
}

/* ---------- 页面 ---------- */
const TITLES = {coming: "即将上映", opened: "已开票", now: "正在热映", wallet: "票夹", feed: "动态"};
function comingView(){
  const all = S.data.movies.filter(m => m.unreleased);
  if (S.q) { const hits = all.filter(match).sort((a,b) => rtKey(a.rt).localeCompare(rtKey(b.rt)));
    return hits.length ? `<div class="rows" style="margin-top:6px">${hits.map(row).join("")}</div>` : `<p class="empty">没有找到"${esc(S.q)}"。</p>`; }
  const favs = all.filter(isFav).sort((a,b) => rtKey(a.rt).localeCompare(rtKey(b.rt)));
  let h = favs.length
    ? `<div class="heroes" id="heroes">${favs.map(heroBlock).join("")}</div>` + (favs.length > 1 ? `<div class="hero-dots" id="dots">${favs.map((_, i) => `<i${i ? "" : ` class="on"`}></i>`).join("")}</div>` : "")
    : `<div class="hero-empty"><span class="ic">${IC.star}</span><div><b>星标你想看的电影</b><span>点开任意一部，点右上角"星标"。它会出现在这里，开票和开分都会推送给你。</span></div></div>`;
  // 近 21 天：按天分组，大海报
  const byDay = {};
  all.filter(m => m.rt && m.rt.length === 10 && daysTo(m.rt) <= 21).forEach(m => (byDay[m.rt] = byDay[m.rt] || []).push(m));
  Object.keys(byDay).sort().forEach(d => {
    const ms = byDay[d].sort((a,b) => (isFav(b) - isFav(a)) || (openedAt(b).length - openedAt(a).length) || b.wish.maoyan - a.wish.maoyan);
    const n = daysTo(d), r = relWord(n);
    h += `<div class="day"><span class="d">${md(d)}</span><span class="w">${wk(d)}</span>${r ? `<span class="rel">${r}</span>` : ""}</div>
      <div class="hscroll">${ms.map(m => card(m)).join("")}</div>`;
  });
  // 更远的：按月，紧凑行
  const later = all.filter(m => !(m.rt && m.rt.length === 10 && daysTo(m.rt) <= 21))
    .sort((a,b) => rtKey(a.rt).localeCompare(rtKey(b.rt)) || b.wish.maoyan - a.wish.maoyan);
  let cur = "", shown = 0, buf = "";
  const flush = () => { if (buf) h += `<div class="rows">${buf}</div>`; buf = ""; };
  for (const m of later) {
    if (shown >= S.limit) break;
    const k = m.rt && m.rt.length >= 7 ? m.rt.slice(0,7) : "tbd";
    if (k !== cur) { flush(); cur = k; const y = +k.slice(0,4), thisY = todayYmd()[0];

/* ---------- 星标：存到仓库的 watch.json，后台据此推送 ---------- */
const gh = {
  token: () => getPref("ghToken", ""),
  repo(){
    const saved = getPref("ghRepo", "");
    if (saved) return saved;
    const h = location.hostname;
    if (!h.endsWith(".github.io")) return "";
    const owner = h.split(".")[0], first = location.pathname.split("/").filter(Boolean)[0];
    return `${owner}/${first || h}`;
  },
  async call(method, path, body){
    const r = await fetch(`https://api.github.com/repos/${gh.repo()}${path}`, {
      method, headers: {Authorization: `Bearer ${gh.token()}`, Accept: "application/vnd.github+json"},
      body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401) throw new Error("密钥无效或已过期，请到设置里重新填写");
    if (r.status === 403) throw new Error("密钥没有写入权限：Contents 需要选 Read and write");
    if (r.status === 404 && method !== "GET") throw new Error("找不到仓库，检查设置里的仓库名");
    return r;
  },
};
const b64e = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));

async function readWatch(){
  const r = await gh.call("GET", `/contents/watch.json?t=${Date.now()}`);
  if (r.status === 404) return {data: {stars: [], ticketing: "all"}, sha: null};
  if (!r.ok) throw new Error(`读取星标失败（HTTP ${r.status}）`);
  const j = await r.json();
  let data; try { data = JSON.parse(b64d(j.content)); } catch { data = {}; }
  data.stars = Array.isArray(data.stars) ? data.stars.filter(x => x && x.id) : [];
  data.ticketing = data.ticketing === "starred" ? "starred" : "all";
  return {data, sha: j.sha};
}
async function writeWatch(mutate, message){
  for (let i = 0; i < 3; i++) {
    const {data, sha} = await readWatch();
    mutate(data);
    const r = await gh.call("PUT", "/contents/watch.json", {message, sha: sha || undefined,
      content: b64e(JSON.stringify(data, null, 1) + "\n")});
    if (r.ok) { S.watch = data; S.sha = (await r.json()).content.sha; return; }
    if (r.status !== 409 && r.status !== 422) throw new Error(`保存失败（HTTP ${r.status}）`);
  }
  throw new Error("保存冲突，请稍后再试");
}
async function syncStars(){
  try {
    const {data, sha} = await readWatch(); S.watch = data; S.sha = sha;
    if (S.local.size) {   // 连接前在手机上点过的星标，一并传上去
      const extra = [...S.local].filter(id => !data.stars.some(x => String(x.id) === id));
      if (extra.length) await writeWatch(d => extra.forEach(id => {
        const m = S.data.movies.find(x => String(x.id) === id);
        if (!d.stars.some(x => String(x.id) === id)) d.stars.push({id: +id, nm: m ? m.nm : "", at: new Date().toISOString()});
      }), `星标 ${extra.length} 部电影`);
      S.local.clear(); setPref("favs", []);
    }
    render(); if ($("#settings").classList.contains("on")) renderSettings();
  } catch (e) { toast(e.message); }
}

/* ---- 存储：本机 + 仓库里的 diary.json ---- */
async function readDiary(){
  const r = await gh.call("GET", `/contents/diary.json?t=${Date.now()}`);
  if (r.status === 404) return {data: {entries: []}, sha: null};
  if (!r.ok) throw new Error(`读取票夹失败（HTTP ${r.status}）`);
  const j = await r.json(); let data; try { data = JSON.parse(b64d(j.content)); } catch { data = {}; }
  data.entries = Array.isArray(data.entries) ? data.entries : [];
  return {data, sha: j.sha};
}
async function writeDiary(mutate, message){
  for (let i = 0; i < 3; i++) {
    const {data, sha} = await readDiary();
    mutate(data.entries);
    const r = await gh.call("PUT", "/contents/diary.json", {message, sha: sha || undefined, content: b64e(JSON.stringify(data, null, 1) + "\n")});
    if (r.ok) return data.entries;
    if (r.status !== 409 && r.status !== 422) throw new Error(`HTTP ${r.status}`);
  }
  throw new Error("保存冲突");
}
const saveLocalDiary = () => setPref("diary", S.diary);
const clean = e => { const c = {...e}; delete c.pending; return c; };
async function syncDiary(){
  if (!gh.token()) return;
  try {
    const {data} = await readDiary();
    const have = new Set(data.entries.map(e => e.id));
    const pending = S.diary.filter(e => e.pending && !have.has(e.id));
    S.diary = pending.length
      ? await writeDiary(l => pending.forEach(e => { if (!l.some(x => x.id === e.id)) l.push(clean(e)); }), `收藏 ${pending.length} 张票根`)
      : data.entries;
    saveLocalDiary();
    if (S.tab === "wallet") render();
  } catch (e) { console.warn("票夹同步失败", e); }
}
async function commitDiary(localMut, remoteMut, message){
  localMut(S.diary); saveLocalDiary();
  if (!gh.token()) return true;
  try { S.diary = await writeDiary(remoteMut, message); saveLocalDiary(); return true; }
  catch (e) { toast("已存在这台手机上，同步到 GitHub 失败，稍后会自动重试"); return false; }
}

      const url = URL.createObjectURL(blob);

      box.innerHTML = `<div class="rv-h"><b>长按图片保存</b><span>保存到相册，或者分享给朋友</span></div><img class="rv-img" src="${url}" alt="票根图片">
        <div class="rv-actions"><button class="btn" id="rvOk2">完成</button></div>`;
      $("#rvOk2").onclick = () => $("#reveal").classList.remove("on");
    }
  } catch (err) { toast("生成图片失败：" + err.message); }
  if (btn) { btn.disabled = false; btn.textContent = "存为图片"; }
}

/* ---- 入口与点击 ---- */
function watchCTA(m){
  const mine = S.diary.filter(e => String(e.mid) === String(m.id)).sort((a, b) => b.date.localeCompare(a.date));
  if (!mine.length) return `<div class="cta"><button class="rec-btn" data-rec="${m.id}">${IC.check}看过了，收进票夹</button></div>`;
  return `<div class="cta"><button class="seen" data-entry="${mine[0].id}"><span>看过${mine.length > 1 ? ` ${mine.length} 次` : ""}</span>${mdc(mine[0].date)}，查看票根</button>
    <button class="rec-again" data-rec="${m.id}">再记一次</button></div>`;
}
document.getElementById("sheet").addEventListener("click", ev => {
  const r = ev.target.closest("[data-rec]"); if (r) { const m = S.data.movies.find(x => String(x.id) === r.dataset.rec); if (m) openRecord(m); return; }
  const en = ev.target.closest("[data-entry]"); if (en) { const e = S.diary.find(x => x.id === en.dataset.entry); if (e) showReveal(e); }
});
document.getElementById("main").addEventListener("click", ev => {
  if (ev.target.closest("#walletSeg")) return;
  const en = ev.target.closest("[data-entry]"); if (en) { const e = S.diary.find(x => x.id === en.dataset.entry); if (e) showReveal(e); return; }
  const bd = ev.target.closest("[data-badge]"); if (bd) { openBadge(bd.dataset.badge); return; }
  if (ev.target.closest("#allBadges")) openBadges();
});
const _render0 = render;
render = function(){ _render0(); bindSeg("walletSeg", render); requestAnimationFrame(updateSheen); };

/* ---------- 交互 ---------- */
$("#main").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) openMovie(b.dataset.id); });
function moveInd(){ const b = document.querySelector(".tabs button[aria-selected=true]"), ind = $("#tabInd"); if (!b) return;
  ind.style.width = b.offsetWidth + "px"; ind.style.transform = `translateX(${b.offsetLeft}px)`; }
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab; S.limit = 60; setPref("tab3", S.tab);
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  moveInd(); render(); window.scrollTo(0, 0);
});
addEventListener("resize", moveInd);
$("#searchBtn").onclick = () => { const on = !$("#searchbox").classList.contains("on");
  $("#searchbox").classList.toggle("on", on); $("#searchBtn").setAttribute("aria-pressed", on);
  if (on) $("#q").focus(); else { $("#q").value = ""; S.q = ""; render(); } };
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 150); });
document.addEventListener("keydown", e => { if (e.key !== "Escape") return;
  if ($("#settings").classList.contains("on")) closeSettings(); else if ($("#sheet").classList.contains("on")) $("#close").click(); });
addEventListener("scroll", () => $("#bar").classList.toggle("scrolled", scrollY > 4), {passive: true});
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.data && Date.now() - new Date(S.data.updated) > 6e5) load(); });

S.tab = getPref("tab3", "coming");
document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === S.tab));
moveInd(); requestAnimationFrame(moveInd);
load();
</script>
</body>
