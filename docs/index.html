<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="电影雷达">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>电影雷达</title>
<style>
:root{
  --night:#1d1828;      /* 放映厅 */
  --seat:#2a2338;       /* 座椅 */
  --seat-2:#352d46;
  --ink:#efe9f4;
  --dim:#a197b3;
  --faint:#6f6582;
  --amber:#f4b740;      /* 开票 */
  --amber-ink:#2b1d00;
  --up:#7fd6a6;
  --warn:#ff8a7a;
  --num:"DIN Condensed","DINCondensed-Bold","Avenir Next Condensed","Arial Narrow",sans-serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
body{padding-bottom:calc(72px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
img{display:block}

/* ---------- 顶部 ---------- */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--night) 78%,rgba(29,24,40,0));
  padding:calc(var(--safe-t) + 14px) 18px 10px}
.top-row{display:flex;align-items:baseline;gap:10px}
.city{font-size:26px;font-weight:700;letter-spacing:.02em}
.updated{color:var(--dim);font-size:13px;flex:1}
.refresh{color:var(--dim);font-size:13px;padding:6px 0 6px 10px}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--seat);border:1px solid transparent;color:var(--ink);
  border-radius:10px;padding:9px 12px;font:inherit;font-size:15px}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--seat-2)}
.toggle{white-space:nowrap;border-radius:10px;padding:0 12px;background:var(--seat);color:var(--dim);font-size:13px}
.toggle[aria-pressed=true]{background:var(--amber);color:var(--amber-ink);font-weight:600}

/* ---------- 底部标签 ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(29,24,40,.94);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--seat);
  padding:6px 4px calc(6px + var(--safe-b))}
.tabs button{flex:1;padding:8px 0;font-size:13px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs button[aria-selected=true] svg{color:var(--amber)}
.badge-dot{position:relative}
.badge-dot[data-n]:after{content:attr(data-n);position:absolute;top:-4px;right:-12px;background:var(--amber);color:var(--amber-ink);
  font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:16px}

/* ---------- 列表 ---------- */
main{padding:0 14px}
.section-title{font-size:13px;color:var(--dim);margin:18px 4px 8px}
.movie{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:12px 4px;border-bottom:1px solid var(--seat);
  width:100%;text-align:left}
.poster{width:78px;height:110px;border-radius:6px;object-fit:cover;background:var(--seat)}
.mbody{min-width:0;display:flex;flex-direction:column;gap:5px}
.mname{font-size:17px;font-weight:600;line-height:1.3;display:flex;gap:6px;align-items:flex-start}
.mname .t{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.star-on{color:var(--amber);flex:none}
.meta{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scores{display:flex;gap:14px;align-items:baseline}
.sc{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--dim)}
.sc b{font-family:var(--num);font-size:21px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:.01em}
.sc b.none{color:var(--faint);font-size:15px}
.wish{font-size:12px;color:var(--dim)}
.wish b{font-family:var(--num);font-size:16px;color:var(--ink);font-weight:700}
.wish .d{color:var(--up)}

/* 票根：开票就"亮"起来 */
.stubs{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.stub{--notch:5px;position:relative;font-size:12px;line-height:1.25;padding:4px 10px 4px 9px;border-radius:3px;
  border:1px dashed var(--seat-2);color:var(--faint);
  -webkit-mask:radial-gradient(circle var(--notch) at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,
         radial-gradient(circle var(--notch) at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle var(--notch) at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,
         radial-gradient(circle var(--notch) at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.stub .cn{font-weight:600}
.stub.open{background:var(--amber);color:var(--amber-ink);border:1px solid var(--amber)}
.stub.open .when{font-family:var(--num);font-size:14px;font-weight:700;margin-left:4px;letter-spacing:.02em}
.stub.fresh{animation:glow 2.4s ease-in-out 1}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(244,183,64,0)}40%{box-shadow:0 0 0 6px rgba(244,183,64,.25)}}
@media (prefers-reduced-motion:reduce){.stub.fresh{animation:none}}

.empty{color:var(--dim);text-align:center;padding:48px 20px}
.more{display:block;margin:16px auto;color:var(--dim);font-size:14px;padding:10px 18px;border-radius:10px;background:var(--seat)}

/* 已开票 */
.cinema{margin:14px 0 22px}
.cinema h2{font-size:19px;margin:0 4px 2px}
.cinema .addr{color:var(--dim);font-size:13px;margin:0 4px 6px}
.opened-at{font-size:12px;color:var(--amber)}

/* 动态 */
.ev{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 4px;border-bottom:1px solid var(--seat);width:100%;text-align:left}
.ev time{grid-row:span 2;font-family:var(--num);font-size:15px;color:var(--dim);padding-top:2px;min-width:54px;white-space:pre-line}
.ev .tt{font-weight:600}
.ev .bd{color:var(--dim);font-size:14px;white-space:pre-line}

/* 数据来源状态 */
.status{margin:26px 4px 10px;font-size:12px;color:var(--faint)}
.status li{list-style:none;display:flex;gap:6px;align-items:center;margin:3px 0}
.status ul{padding:0;margin:6px 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--up);flex:none}
.dot.bad{background:var(--warn)}

/* ---------- 详情 ---------- */
.sheet{position:fixed;inset:0;z-index:10;background:var(--night);overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--safe-t) + 10px) 14px 10px;background:linear-gradient(var(--night) 70%,rgba(29,24,40,0));z-index:2}
.sheet-bar button{background:var(--seat);border-radius:18px;padding:6px 14px;font-size:14px}
.sheet-bar .fav[aria-pressed=true]{background:var(--amber);color:var(--amber-ink);font-weight:600}
.hero{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:4px 18px 8px}
.hero img{width:120px;height:168px;border-radius:8px;object-fit:cover;background:var(--seat)}
.hero h1{font-size:23px;line-height:1.25;margin:2px 0 4px}
.hero .en{color:var(--dim);font-size:13px;margin-bottom:8px}
.facts{font-size:13px;color:var(--dim);display:grid;gap:2px}
.big-scores{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 18px 6px;background:var(--seat);border-radius:12px}
.big-scores a{padding:12px 6px;text-align:center;text-decoration:none}
.big-scores a+a{border-left:1px solid var(--night)}
.big-scores b{display:block;font-family:var(--num);font-size:34px;line-height:1.05;font-weight:700}
.big-scores b.none{font-size:18px;color:var(--faint);line-height:1.9}
.big-scores small{display:block;color:var(--dim);font-size:12px;line-height:1.4}
.wish-panel{margin:10px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wish-panel div{background:var(--seat);border-radius:12px;padding:10px 12px}
.wish-panel b{font-family:var(--num);font-size:24px;display:block;line-height:1.1}
.wish-panel small{color:var(--dim);font-size:12px}
.spark{margin:4px 18px 0;color:var(--dim);font-size:12px}
.spark svg{width:100%;height:56px;display:block}
.block{margin:18px 18px}
.block h3{font-size:15px;margin:0 0 8px;color:var(--ink)}
.tickets{display:grid;gap:8px}
.ticket{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:10px;padding:10px 14px;background:var(--seat)}
.ticket.open{background:var(--amber);color:var(--amber-ink)}
.ticket .name{font-weight:600}
.ticket .info{font-size:13px;text-align:right;line-height:1.35}
.ticket:not(.open) .info{color:var(--faint)}
.dra{color:#d4cce0;font-size:15px;line-height:1.75;margin:0}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{background:var(--seat);border-radius:10px;padding:9px 14px;font-size:14px;text-decoration:none}
.tip{color:var(--faint);font-size:12px;margin:24px 18px calc(30px + var(--safe-b))}

/* ---------- 设置 ---------- */
.set h2{font-size:22px;margin:4px 18px 4px}
.set .lead{color:var(--dim);font-size:14px;margin:0 18px 6px}
.set .block p{color:var(--dim);font-size:14px;margin:0 0 8px}
.state{display:inline-block;font-size:13px;border-radius:6px;padding:1px 8px;background:var(--seat);color:var(--dim)}
.state.ok{background:rgba(127,214,166,.15);color:var(--up)}
.steps{margin:0 0 10px;padding-left:20px;color:#d4cce0;font-size:14px;line-height:1.7}
.steps code{background:var(--seat);border-radius:4px;padding:0 4px;font-size:13px}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;background:var(--seat);border:1px solid var(--seat-2);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
.btn{background:var(--amber);color:var(--amber-ink);font-weight:600;border-radius:10px;padding:10px 16px;white-space:nowrap}
.btn.ghost{background:var(--seat);color:var(--ink);font-weight:400}
.btn:disabled{opacity:.5}
.choice{display:flex;gap:10px;align-items:flex-start;background:var(--seat);border-radius:10px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.choice input{accent-color:var(--amber);margin-top:4px}
.choice small{display:block;color:var(--dim);font-size:13px}
.starlist{display:grid;gap:6px}
.starlist div{display:flex;justify-content:space-between;align-items:center;background:var(--seat);border-radius:10px;padding:8px 12px}
.starlist button{color:var(--dim);font-size:13px;padding:4px 0 4px 10px}
.err{color:var(--warn);font-size:13px;margin-top:6px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(76px + var(--safe-b));z-index:20;background:var(--ink);color:var(--night);
  border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;
  transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast span{flex:1}
.toast button{font-weight:700;color:#7a4f00;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="city" id="city">电影雷达</div>
    <div class="updated" id="updated">加载中…</div>
    <button class="refresh" id="refresh" aria-label="刷新数据">刷新</button>
    <button class="refresh" id="openSettings">设置</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="搜片名、导演、演员" autocomplete="off" enterkeyhint="search">
    <button class="toggle" id="onlyOpen" aria-pressed="false">只看已开票</button>
  </div>
</header>

<main id="main"></main>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="coming" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>待映</button>
  <button role="tab" data-tab="opened" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10a2 2 0 0 0 0 4v4h18v-4a2 2 0 0 0 0-4V6H3z"/><path d="M14 7v10" stroke-dasharray="2 2"/></svg>已开票</button>
  <button role="tab" data-tab="now" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 5v5M16 5v5"/></svg>热映</button>
  <button role="tab" data-tab="feed" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge-dot" id="feedBadge">动态</span></button>
</nav>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="电影详情"></section>
<section class="sheet set" id="settings" role="dialog" aria-modal="true" aria-label="推送设置"></section>
<div class="toast" id="toast" role="status" aria-live="polite"><span></span><button hidden></button></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WK = "日一二三四五六";
const S = { tab: "coming", q: "", onlyOpen: false, limit: 40, data: null, hist: {}, events: [], status: {},
  local: new Set(getPref("favs", []).map(String)),   // 没连 GitHub 时只存在这台手机上的星标
  watch: null,                                       // 从仓库 watch.json 读到的 {stars, ticketing}
  sha: null };
function getPref(k, d){ try { const v = localStorage.getItem("radar." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function setPref(k, v){ try { localStorage.setItem("radar." + k, JSON.stringify(v)); } catch {} }

function wan(n){ if (n == null) return "–"; if (n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,"") + "亿"; if (n >= 1e4) return (n/1e4).toFixed(1).replace(/\.0$/,"") + "万"; return String(n); }
function signed(n){ return !n ? "" : (n > 0 ? "+" : "-") + wan(Math.abs(n)); }

/* 日期一律按北京时间的字符串处理，不受手机时区影响 */
function ymd(d){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? [+m[1], +m[2], +m[3]] : null; }
function md(d){ const x = ymd(d); return x ? `${x[1]}/${x[2]}` : (d || ""); }
function rel(d){
  const x = ymd(d); if (!x) return d || "";
  const t = ymd(new Date().toLocaleDateString("en-CA", {timeZone:"Asia/Shanghai"}));
  const diff = Math.round((Date.UTC(x[0], x[1]-1, x[2]) - Date.UTC(t[0], t[1]-1, t[2])) / 864e5);
  if (diff === 0) return "今天"; if (diff === 1) return "明天"; if (diff === 2) return "后天";
  return `${x[1]}月${x[2]}日`;
}
/* 上映日期有三种精度：2026-11-06 / 2026-12 / 2026 */
function rtKey(rt){ if (!rt) return "9999-99-99"; if (rt.length === 4) return rt + "-99-99"; if (rt.length === 7) return rt + "-99"; return rt; }
function rtLabel(rt){ if (!rt) return "日期待定"; if (rt.length === 4) return rt + "年上映，日期待定"; if (rt.length === 7) return +rt.slice(5) + "月上映"; return rel(rt) + "上映"; }
function ago(iso){
  if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (m < 1) return "刚刚"; if (m < 60) return m + " 分钟前"; const h = Math.round(m/60); if (h < 24) return h + " 小时前";
  return Math.round(h/24) + " 天前";
}
function hm(iso){ return new Date(iso).toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}); }
function starIds(){
  if (S.watch) return new Set(S.watch.stars.map(x => String(x.id)));
  return new Set([...(S.data && S.data.stars || []).map(String), ...S.local]);
}
// 连上 GitHub 后以仓库里的星标为准；否则用上次抓取的结果 + 这台手机上的星标
const isFav = m => S.watch ? starIds().has(String(m.id)) : (starIds().has(String(m.id)) || m.watch);
const isOpen = m => Object.keys(m.opened || {}).length > 0;

/* 三个评分 */
function rate(kind, m, big){
  const none = big ? `<b class="none">暂无</b>` : `<b class="none">暂无</b>`;
  if (kind === "douban") return m.douban && m.douban.sc > 0 ? `<b>${m.douban.sc.toFixed(1)}</b>` : none;
  if (kind === "imdb") return m.imdb && m.imdb.sc ? `<b>${m.imdb.sc.toFixed(1)}</b>` : none;
  if (kind === "tomato") return m.tomato && m.tomato.critics != null ? `<b>${m.tomato.critics}%</b>` : none;
}

/* ---------- 数据 ---------- */
async function load(){
  if (window.__RADAR__) { apply(window.__RADAR__); return; }
  const t = Date.now();
  const get = f => fetch(`data/${f}?t=${t}`, {cache:"no-store"}).then(r => r.ok ? r.json() : null).catch(() => null);
  const [movies, hist, events, status] = await Promise.all(["movies.json","history.json","events.json","status.json"].map(get));
  if (!movies) { $("#updated").textContent = "还没有数据"; $("#main").innerHTML =
    `<p class="empty">数据还没生成。去 GitHub 仓库的 Actions 页面手动运行一次"更新电影数据"，几分钟后刷新这里。</p>`; return; }
  apply({movies, hist, events, status});
}
function apply(d){
  S.data = d.movies; S.hist = d.hist || {}; S.events = d.events || []; S.status = (d.status && d.status.sources) || {};
  $("#city").textContent = S.data.city || "电影雷达";
  $("#updated").textContent = "更新于 " + ago(S.data.updated);
  const seenAt = getPref("feedSeen", "");
  const unread = S.events.filter(e => e.at > seenAt && e.type !== "system").length;
  if (unread) $("#feedBadge").dataset.n = unread > 9 ? "9+" : unread; else delete $("#feedBadge").dataset.n;
  render();
  const m = location.hash.match(/^#m(\d+)/); if (m) openMovie(m[1], false);
  if (gh.token() && !S.watch) syncStars();
}

/* ---------- 渲染 ---------- */
function stubs(m){
  if (!m.unreleased) return "";
  return `<div class="stubs">` + S.data.cinemas.map(c => {
    const o = (m.opened || {})[String(c.id)];
    if (o) {
      const fresh = o.at && Date.now() - new Date(o.at) < 864e5;
      return `<span class="stub open${fresh ? " fresh" : ""}"><span class="cn">${esc(c.short)}</span><span class="when">${esc(md(o.first))}首场</span></span>`;
    }
    return `<span class="stub"><span class="cn">${esc(c.short)}</span> 未开票</span>`;
  }).join("") + `</div>`;
}
function row(m, extra = ""){
  const meta = [m.status === "coming" || m.unreleased ? rtLabel(m.rt) : (m.rt ? m.rt.slice(0,4) : ""), m.cat, m.dur ? m.dur + "分钟" : ""].filter(Boolean).join("  ");
  const dm = m.delta && m.delta.maoyan;
  return `<button class="movie" data-id="${m.id}">
    <img class="poster" loading="lazy" src="${esc(m.img)}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
    <div class="mbody">
      <div class="mname"><span class="t">${esc(m.nm)}</span>${isFav(m) ? `<svg class="star-on" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-label="已关注"><path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>` : ""}</div>
      <div class="meta">${esc(meta)}</div>
      <div class="scores">
        <span class="sc">豆瓣 ${rate("douban", m)}</span>

function spark(id){
  const h = S.hist[id]; if (!h || h.length < 2) return "";
  const W = 320, H = 50, xs = i => 4 + i * (W - 8) / (h.length - 1);
  const line = (k, color) => {
    const vals = h.map(p => p[k]); const mn = Math.min(...vals), mx = Math.max(...vals), span = mx - mn || 1;
    return `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" points="${vals.map((v,i) => `${xs(i).toFixed(1)},${(H - 4 - (v - mn) / span * (H - 10)).toFixed(1)}`).join(" ")}"/>`;
  };
  return `<div class="spark">近 ${h.length} 天想看人数走势（琥珀色猫眼，浅色淘票票）
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${h.some(p => p[2]) ? line(2, "#d9ece6") : ""}${line(1, "#f4b740")}</svg></div>`;
}

/* ---------- 星标：存到仓库的 watch.json，后台据此推送 ---------- */
const gh = {
  token: () => getPref("ghToken", ""),
  repo(){
    const saved = getPref("ghRepo", "");
    if (saved) return saved;
    const h = location.hostname;
    if (!h.endsWith(".github.io")) return "";
    const owner = h.split(".")[0], first = location.pathname.split("/").filter(Boolean)[0];
    return `${owner}/${first || h}`;
  },
  async call(method, path, body){
    const r = await fetch(`https://api.github.com/repos/${gh.repo()}${path}`, {
      method, headers: {Authorization: `Bearer ${gh.token()}`, Accept: "application/vnd.github+json"},
      body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401) throw new Error("密钥无效或已过期，请到设置里重新填写");
    if (r.status === 403) throw new Error("密钥没有写入权限：Contents 需要选 Read and write");
    if (r.status === 404 && method !== "GET") throw new Error("找不到仓库，检查设置里的仓库名");
    return r;
  },
};
const b64e = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));

async function readWatch(){
  const r = await gh.call("GET", `/contents/watch.json?t=${Date.now()}`);
  if (r.status === 404) return {data: {stars: [], ticketing: "all"}, sha: null};
  if (!r.ok) throw new Error(`读取星标失败（HTTP ${r.status}）`);
  const j = await r.json();
  let data; try { data = JSON.parse(b64d(j.content)); } catch { data = {}; }
  data.stars = Array.isArray(data.stars) ? data.stars.filter(x => x && x.id) : [];
  data.ticketing = data.ticketing === "starred" ? "starred" : "all";
  return {data, sha: j.sha};
}
async function writeWatch(mutate, message){
  for (let i = 0; i < 3; i++) {
    const {data, sha} = await readWatch();
    mutate(data);
    const r = await gh.call("PUT", "/contents/watch.json", {message, sha: sha || undefined,
      content: b64e(JSON.stringify(data, null, 1) + "\n")});
    if (r.ok) { S.watch = data; S.sha = (await r.json()).content.sha; return; }
    if (r.status !== 409 && r.status !== 422) throw new Error(`保存失败（HTTP ${r.status}）`);
  }
  throw new Error("保存冲突，请稍后再试");
}
async function syncStars(){
  try {
    const {data, sha} = await readWatch(); S.watch = data; S.sha = sha;
    if (S.local.size) {   // 连接前在手机上点过的星标，一并传上去
      const extra = [...S.local].filter(id => !data.stars.some(x => String(x.id) === id));
      if (extra.length) await writeWatch(d => extra.forEach(id => {
        const m = S.data.movies.find(x => String(x.id) === id);
        if (!d.stars.some(x => String(x.id) === id)) d.stars.push({id: +id, nm: m ? m.nm : "", at: new Date().toISOString()});
      }), `星标 ${extra.length} 部电影`);
      S.local.clear(); setPref("favs", []);
    }
    render(); if ($("#settings").classList.contains("on")) renderSettings();
  } catch (e) { toast(e.message); }
}
async function toggleStar(m){
  const id = String(m.id), on = !isFav(m);
  const btn = $("#fav");
  const paint = v => { if (btn) { btn.setAttribute("aria-pressed", v); btn.textContent = v ? "★ 已星标" : "☆ 星标"; } };
  if (!gh.token()) {
    if (!on && !S.local.has(id)) { toast("这颗星保存在 GitHub 上，先在设置里连接 GitHub 才能取消。", "去设置", openSettings); return; }
    on ? S.local.add(id) : S.local.delete(id); setPref("favs", [...S.local]);
    paint(on); render();
    if (on) toast("已在这台手机上星标。要收到推送，先在设置里连接 GitHub。", "去设置", openSettings);
    return;
  }
  paint(on);
  try {
    await writeWatch(d => {
      d.stars = d.stars.filter(x => String(x.id) !== id);
      if (on) d.stars.push({id: m.id, nm: m.nm, at: new Date().toISOString()});
    }, `${on ? "星标" : "取消星标"}《${m.nm}》`);
    render();
    toast(on ? `已星标《${m.nm}》，开票和开分都会推送给你` : `已取消星标《${m.nm}》`);
  } catch (e) { paint(!on); toast(e.message); }
}

let toastTimer;
function toast(msg, action, fn){
  const t = $("#toast"); t.querySelector("span").textContent = msg;
  const b = t.querySelector("button"); b.hidden = !action; b.textContent = action || ""; b.onclick = () => { t.classList.remove("on"); fn && fn(); };
  t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), action ? 6000 : 3500);
}

    catch (e) { toast(e.message); renderSettings(); }
  });
  $("#settings").querySelectorAll("[data-unstar]").forEach(b => b.onclick = async () => {
    const m = byId[b.dataset.unstar] || {id: +b.dataset.unstar, nm: ""};
    await toggleStar(m); renderSettings();
  });
}
function openSettings(){ closeMovie(); renderSettings(); $("#settings").classList.add("on"); document.body.style.overflow = "hidden"; }
function closeSettings(){ $("#settings").classList.remove("on"); document.body.style.overflow = ""; }
$("#openSettings").onclick = openSettings;

/* ---------- 交互 ---------- */
$("#main").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) openMovie(b.dataset.id); });
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab; S.limit = 40; setPref("tab2", S.tab);
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  render(); window.scrollTo(0, 0);
});
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); S.limit = 40; render(); }, 150); });
$("#onlyOpen").onclick = e => { S.onlyOpen = !S.onlyOpen; setPref("onlyOpen", S.onlyOpen); e.currentTarget.setAttribute("aria-pressed", S.onlyOpen); render(); };
$("#refresh").onclick = () => { $("#updated").textContent = "刷新中…"; load(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.data && Date.now() - new Date(S.data.updated) > 6e5) load(); });

S.tab = getPref("tab2", "coming"); S.onlyOpen = getPref("onlyOpen", false);
document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === S.tab));
$("#onlyOpen").setAttribute("aria-pressed", S.onlyOpen);
load();
</script>
</body>
