name: 更新电影数据

on:
  push:
    branches: [main]
    paths: ["config.json", "scraper/**", "docs/**", ".github/workflows/**"]
  schedule:
    - cron: "3-59/5 * * * *"   # 每 5 分钟触发；避开整点拥堵，GitHub 高峰期仍可能延迟
  workflow_dispatch:
    inputs:
      mode:
        description: "运行方式"
        type: choice
        default: normal
        options:
          - normal      # 正常抓取
          - force       # 忽略间隔，全部重抓
          - test-push   # 只发一条测试推送到手机

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: movie-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: 取回上一次的数据
        run: |
          # 分清"数据分支真的还没有"（第一次运行）和"这一下没连上"：
          # 没连上就重试，还不行就让这一轮失败，绝不能当成第一次运行把记忆清空（那样会漏掉刚开的票）
          found=""
          for i in 1 2 3 4; do
            rc=0; git ls-remote --exit-code --heads origin radar-data >/dev/null 2>&1 || rc=$?
            if [ "$rc" = 0 ] && git fetch --depth=1 origin radar-data; then found=yes; break; fi
            if [ "$rc" = 2 ]; then found=none; break; fi
            echo "第 $i 次取数据没成功，$((i * 6)) 秒后重试"; sleep $((i * 6))
          done
          if [ "$found" = yes ]; then
            mkdir -p _store && git archive FETCH_HEAD | tar -x -C _store
            test -s _store/state/state.json || { echo "取回的数据不完整，这一轮先不跑"; exit 1; }
            mkdir -p state docs/data
            cp -r _store/state/. state/
            cp -r _store/data/. docs/data/ 2>/dev/null || true
            rm -rf _store
          elif [ "$found" = none ]; then
            echo "第一次运行，没有历史数据"
          else
            echo "连不上数据分支，这一轮先不跑，下一轮再试"; exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 测试推送
        if: inputs.mode == 'test-push'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ vars.BARK_SERVER }}  # 和正式推送用同一套设置，测试通了正式的才一定通
        run: python scraper/run.py --test-push

      - name: 抓取数据
        id: scrape
        if: inputs.mode != 'test-push'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ vars.BARK_SERVER }}
          DATA_REPO: ${{ vars.DATA_REPO }}      # 私有数据仓库，如 yourname/movie-radar-data
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }} # 能读这个私有仓库的密钥
        run: python scraper/run.py ${{ inputs.mode == 'force' && '--force' || '' }}

      - name: 保存数据（覆盖式，不让仓库越来越大）
        if: inputs.mode != 'test-push'
        run: |
          rm -rf /tmp/store && mkdir -p /tmp/store/state /tmp/store/data
          cp -r state/. /tmp/store/state/
          cp -r docs/data/. /tmp/store/data/
          cd /tmp/store
          git init -q -b radar-data
          git config user.name "movie-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "数据 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          # GitHub 偶尔会临时拒绝推送（fatal error in commit_refs），隔一会儿重试，最多 5 次
          for i in 1 2 3 4 5; do
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" radar-data && exit 0
            echo "第 $i 次保存失败，$((i * 8)) 秒后重试"; sleep $((i * 8))
          done
          exit 1

      # 抓取这一步自己坏了（程序崩了、数据取不回来）时，上面的"检查失败"提醒也发不出来，所以在这里兜底：
      # 连着 3 轮没跑成功就推送一次（只在第 3 轮推，不会每 5 分钟响一遍）
      - name: 连续出错时提醒
        if: ${{ failure() && inputs.mode != 'test-push' && steps.scrape.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ vars.BARK_SERVER }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/update.yml/runs?status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0:3] | map(.conclusion) | join(",")' || true)
          echo "前三轮：$last"
          if [ "$last" = "failure,failure,success" ]; then
            python3 -c "import sys; sys.path.insert(0, 'scraper'); import notify; notify.push('⚠️ 电影雷达后台连续出错', '已经连着 3 轮没跑成功，这段时间开票不会提醒。会继续自动重试，一直不恢复的话来找我看看。', None, 'timeSensitive')" || true
          fi

      - name: 防止 GitHub 60 天无活动自动停用定时任务
        if: ${{ !cancelled() && inputs.mode != 'test-push' && steps.scrape.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
          # 每 25 天往主分支提交一次时间戳，算作仓库活动（这个文件不在触发路径里，不会引起额外运行）
          f=.github/keepalive.txt
          last=$(cat "$f" 2>/dev/null || echo 0); now=$(date +%s)
          if [ $((now - last)) -gt 2160000 ]; then
            echo "$now" > "$f"
            git config user.name "movie-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$f" && git commit -q -m "保活" && git push -q || echo "保活提交没成功，下次再试"
          fi

      # 就算数据没保存成功，也照样更新网页
      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() && inputs.mode != 'test-push' && steps.scrape.outcome == 'success' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && inputs.mode != 'test-push' && steps.scrape.outcome == 'success' }}
        with:
          path: docs
      - id: deploy
        if: ${{ !cancelled() && inputs.mode != 'test-push' && steps.scrape.outcome == 'success' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub 偶尔会临时找不到刚上传的网页包（No artifacts named "github-pages"），等一会儿再部署一次
      - name: 部署失败，20 秒后重试
        if: ${{ !cancelled() && steps.deploy.outcome == 'failure' }}
        run: sleep 20
      - id: deploy2
        if: ${{ !cancelled() && steps.deploy.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
